[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathshield"
version = "0.1.0"
description = "Cybersecurity graph and retrieval experiments for PathShield"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.13",
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
pathshield-retrieval = "pathshield.retrieval:main"
pathshield-evaluate = "pathshield.evaluate_retrieval:main"

[tool.setuptools.packages.find]
where = ["src"]
